<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Let's build something amazing">
  <title>Let's build something amazing</title>
  <defs>
    <linearGradient id="g_footer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="30%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#1a1b27"/>
    </linearGradient>
    <linearGradient id="sheen_footer_grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round_footer">
      <rect width="1200" height="120" rx="16" ry="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round_footer)">
    <rect width="1200" height="120" fill="url(#g_footer)"/>
    <rect width="340" height="120" fill="url(#sheen_footer_grad)">
      <animate attributeName="x" values="-340;1200" dur="9s" begin="0s;sheen_footer.end+5s" id="sheen_footer"/>
    </rect>
    <text x="600" y="54" text-anchor="middle"
      font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-weight="600" font-size="26" fill="#ffffff" letter-spacing="0.5">Let's build something amazing</text>
  </g>
</svg>
