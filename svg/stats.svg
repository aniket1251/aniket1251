<svg xmlns="http://www.w3.org/2000/svg" width="500" height="372" viewBox="0 0 500 372" role="img" aria-label="GitHub statistics">
  <style>
    .title { font: 700 20px 'Segoe UI', Ubuntu, sans-serif; fill: #a855f7; }
    .label { font: 600 15px 'Segoe UI', Ubuntu, sans-serif; fill: #e2e8f0; }
    .value { font: 700 16px 'Segoe UI', Ubuntu, sans-serif; }
    .section { font: 700 15px 'Segoe UI', Ubuntu, sans-serif; fill: #a855f7; }
    .pill { font: 600 13px 'Segoe UI', Ubuntu, sans-serif; fill: #e2e8f0; }
    .divider { stroke: #232640; stroke-width: 1; }
  </style>
  <rect width="500" height="372" rx="12" fill="#1a1b27"/>
  <rect x="0.5" y="0.5" width="499" height="371" rx="12" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
  <text x="24" y="40" class="title">GitHub Analytics</text>
  
    <text x="24" y="78" class="label">Commits</text>
    <text x="476" y="78" class="value" fill="#6366f1" text-anchor="end">552</text>
    <line x1="24" y1="88" x2="476" y2="88" class="divider"/>
    <text x="24" y="112" class="label">Stars</text>
    <text x="476" y="112" class="value" fill="#a855f7" text-anchor="end">6</text>
    <line x1="24" y1="122" x2="476" y2="122" class="divider"/>
    <text x="24" y="146" class="label">Forks</text>
    <text x="476" y="146" class="value" fill="#6366f1" text-anchor="end">3</text>
    <line x1="24" y1="156" x2="476" y2="156" class="divider"/>
    <text x="24" y="180" class="label">Watchers</text>
    <text x="476" y="180" class="value" fill="#a855f7" text-anchor="end">13</text>
    <line x1="24" y1="190" x2="476" y2="190" class="divider"/>
    <text x="24" y="214" class="label">Followers</text>
    <text x="476" y="214" class="value" fill="#6366f1" text-anchor="end">3</text>
    <line x1="24" y1="224" x2="476" y2="224" class="divider"/>
  <text x="24" y="266" class="section">Top Languages</text>
  
    <g>
      <rect x="24" y="284" width="144" height="26" rx="13" fill="#1a1b27" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="39" cy="297" r="5" fill="#6366f1"/>
      <text x="51" y="301" class="pill">Jupyter Notebook</text>
    </g>
    <g>
      <rect x="178" y="284" width="96" height="26" rx="13" fill="#1a1b27" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="193" cy="297" r="5" fill="#a855f7"/>
      <text x="205" y="301" class="pill">TypeScript</text>
    </g>
    <g>
      <rect x="284" y="284" width="96" height="26" rx="13" fill="#1a1b27" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="299" cy="297" r="5" fill="#6366f1"/>
      <text x="311" y="301" class="pill">JavaScript</text>
    </g>
    <g>
      <rect x="390" y="284" width="60" height="26" rx="13" fill="#1a1b27" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="405" cy="297" r="5" fill="#a855f7"/>
      <text x="417" y="301" class="pill">CSS</text>
    </g>
    <g>
      <rect x="24" y="322" width="60" height="26" rx="13" fill="#1a1b27" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="39" cy="335" r="5" fill="#6366f1"/>
      <text x="51" y="339" class="pill">TeX</text>
    </g>
</svg>
