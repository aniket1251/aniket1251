name: Generate Stats

on:
  schedule:
    - cron: "0 */4 * * *" # Runs every 4 hours
  workflow_dispatch: # Allow manual trigger
  repository_dispatch: # Allow triggering from other repos
    types: [refresh-profile]
  push:
    branches:
      - master

# Prevent overlapping stats runs from racing each other on the same branch.
concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats and update README
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md stats.json stats.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile stats [skip ci]"
            # Remote master may have advanced since checkout; rebase our commit
            # on top of the latest before pushing to avoid non-fast-forward.
            git pull --rebase origin master
            git push origin HEAD:master
          fi
