name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */4 * * *" # Runs every 4 hours
  workflow_dispatch: # Allow manual trigger
  repository_dispatch: # Allow triggering from other repos
    types: [refresh-profile]
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Themed to match the profile: purple snake, indigo→purple dots,
          # dark indigo background. color_dots go from empty → most active.
          outputs: |
            dist/github-snake.svg?color_snake=%23a855f7&color_dots=%23232640,%233b3f6b,%236366f1,%238b5cf6,%23a855f7&color_background=%231a1b27
            dist/github-snake-dark.svg?color_snake=%23a855f7&color_dots=%23232640,%233b3f6b,%236366f1,%238b5cf6,%23a855f7&color_background=%231a1b27

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
