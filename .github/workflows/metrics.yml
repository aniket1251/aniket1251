name: Generate Metrics

on:
  schedule:
    - cron: "0 */4 * * *" # Runs every 4 hours
  workflow_dispatch: # Allow manual trigger
  repository_dispatch: # Allow triggering from other repos
    types: [refresh-profile]
  push:
    branches:
      - master

jobs:
  github-metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Overview card: header + commits-only activity + stars/forks/watchers
      - name: Generate overview metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, repositories
          base_indepth: yes
          config_timezone: Asia/Kolkata
          config_output: svg
          config_display: large
          config_animations: yes
          config_padding: 6%
          committer_branch: metrics-output
          extras_css: |
            /* ---- Theme (matches README: indigo/purple on dark) ---- */
            :root { background: #1a1b27 !important; }
            svg, .background { fill: #1a1b27 !important; background: #1a1b27 !important; }
            h2, .title { fill: #a855f7 !important; }
            text, tspan, .field { fill: #e2e8f0 !important; }
            .octicon { fill: #6366f1 !important; }
            a { fill: #6366f1 !important; }
          extras_js: |
            // Remove specific stat lines by their visible text.
            // Text-based so it survives DOM reordering between releases.
            const REMOVE = [
              "Pull requests reviewed",
              "Pull requests opened",
              "Issues opened",
              "issue comments",
              "license",
              "Releases",
              "Packages",
              "MB used",
              "Sponsors",
              "added",   // "0 added, 0 removed" line
            ];
            document.querySelectorAll(".field").forEach(el => {
              const t = (el.textContent || "").trim();
              if (REMOVE.some(k => t.toLowerCase().includes(k.toLowerCase()))) {
                el.remove();
              }
            });

      # Languages card
      - name: Generate languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_output: svg
          config_animations: yes
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          committer_branch: metrics-output
          extras_css: |
            svg, .background { fill: #1a1b27 !important; background: #1a1b27 !important; }
            h2, .title { fill: #a855f7 !important; }
            text, tspan, .field { fill: #e2e8f0 !important; }
            .octicon { fill: #6366f1 !important; }

      # Isometric contribution calendar
      - name: Generate isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-calendar.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_output: svg
          config_animations: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_branch: metrics-output
          extras_css: |
            svg, .background { fill: #1a1b27 !important; background: #1a1b27 !important; }
            h2, .title { fill: #a855f7 !important; }
            text, tspan, .field { fill: #e2e8f0 !important; }
            .octicon { fill: #6366f1 !important; }
