name: Generate Metrics

on:
  schedule:
    - cron: "0 */4 * * *" # Runs every 4 hours
  workflow_dispatch: # Allow manual trigger
  repository_dispatch: # Allow triggering from other repos
    types: [refresh-profile]
  push:
    branches:
      - master

jobs:
  github-metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Overview card: header + commits-only activity + stars/forks/watchers
      - name: Generate overview metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, repositories
          base_indepth: yes
          config_timezone: Asia/Kolkata
          config_output: svg
          config_display: large
          config_animations: yes
          config_padding: 6%
          committer_branch: metrics-output
          extras_css: |
            /* ---- Theme (matches README: indigo/purple on dark) ---- */
            body, .background { fill: #1a1b27 !important; }
            svg { background: #1a1b27 !important; }
            h2, .title { fill: #a855f7 !important; color: #a855f7 !important; }
            .field, text, tspan { fill: #e2e8f0 !important; }
            .octicon, .icon svg { fill: #6366f1 !important; }
            a, .repositories .field a { fill: #6366f1 !important; }

            /* ---- Activity: keep commits, hide everything else ---- */
            /* Order in activity block: commits, PRs, PR reviews, issues, comments */
            .activity .field:not(:first-child) { display: none !important; }

            /* ---- Repositories: keep stars, forks, watchers only ---- */
            /* Hide the noisy lines: releases, packages, sponsors, licence, size, diff */
            .repositories .field:nth-child(n+4) { display: none !important; }

            /* Tighten spacing after hiding rows */
            .row { margin: 0 !important; }

      # Languages card
      - name: Generate languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_output: svg
          config_animations: yes
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          committer_branch: metrics-output
          extras_css: |
            body, .background { fill: #1a1b27 !important; }
            svg { background: #1a1b27 !important; }
            h2, .title { fill: #a855f7 !important; }
            text, tspan, .field { fill: #e2e8f0 !important; }
            .octicon { fill: #6366f1 !important; }

      # Isometric contribution calendar
      - name: Generate isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-calendar.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_output: svg
          config_animations: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_branch: metrics-output
          extras_css: |
            body, .background { fill: #1a1b27 !important; }
            svg { background: #1a1b27 !important; }
            h2, .title { fill: #a855f7 !important; }
            text, tspan, .field { fill: #e2e8f0 !important; }
            .octicon { fill: #6366f1 !important; }
