name: Generate Metrics

on:
  schedule:
    - cron: "0 */4 * * *" # Runs every 4 hours
  workflow_dispatch: # Allow manual trigger
  repository_dispatch: # Allow triggering from other repos
    types: [refresh-profile]
  push:
    branches:
      - master

jobs:
  github-metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Overview stats card
      - name: Generate overview metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_output: svg
          config_padding: 6%
          config_display: large
          plugin_lines: yes
          commits_authoring: ${{ github.repository_owner }}
          committer_branch: metrics-output

      # Languages card
      - name: Generate languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_output: svg
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          committer_branch: metrics-output

      # Isometric contribution / streak calendar
      - name: Generate isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-calendar.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_output: svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_branch: metrics-output
